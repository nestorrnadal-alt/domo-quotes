<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Domo — Service Agreement</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy:#142543; --blue:#3652A5; --peri:#80A2F9; --cyan:#8BD7D7; --lime:#D6E264;
    --ink:#142543; --soft:#48546e; --faint:#7b869e; --line:#e2e7f2; --bg:#eef1f8; --card:#fff;
    --green:#1a7f37; --red:#b3261e;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;line-height:1.6;}
  .wrap{max-width:760px;margin:0 auto;padding:0 18px 60px;}
  header{background:linear-gradient(155deg,var(--navy),#1d3160 82%);color:#fff;}
  .head-inner{max-width:760px;margin:0 auto;padding:26px 18px 30px;}
  .logo{font-size:26px;font-weight:800;letter-spacing:-.02em;color:#fff;}
  .logo .dot{color:var(--cyan);}
  .logo-img{height:34px;width:auto;display:block;}
  .doc-kicker{margin-top:16px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);font-weight:700;}
  .doc-title{font-size:clamp(24px,5vw,32px);font-weight:800;margin:4px 0 0;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 1px 2px rgba(20,37,67,.05),0 10px 30px rgba(20,37,67,.07);
    padding:26px;margin-top:22px;}
  .status-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
    padding:4px 11px;border-radius:999px;}
  .status-pill.draft{background:#eef1f9;color:var(--soft);}
  .status-pill.sent{background:#e6ebfa;color:var(--blue);}
  .status-pill.signed{background:#e6f4ea;color:var(--green);}
  .status-pill.void{background:#fce8e6;color:var(--red);}
  h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);
    font-weight:700;margin:26px 0 8px;border-top:1px solid var(--line);padding-top:18px;}
  .card > h2.sec:first-of-type{border-top:none;padding-top:0;margin-top:10px;}
  .parties{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .party .role{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:700;}
  .party .name{font-weight:700;margin-top:2px;}
  .party .meta{font-size:13px;color:var(--soft);}
  .scope-box{white-space:pre-wrap;background:#f7f9fd;border:1px solid var(--line);border-radius:10px;padding:14px;font-size:14.5px;}
  .price-grid{display:grid;grid-template-columns:1fr auto;gap:8px 16px;font-size:15px;}
  .price-grid .lbl{color:var(--soft);}
  .price-grid .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;}
  .price-grid .total{font-size:18px;font-weight:800;border-top:1px solid var(--line);padding-top:10px;margin-top:4px;}
  .price-grid .deposit{color:var(--blue);font-weight:800;}
  .terms{font-size:14px;color:var(--soft);}
  .terms p{margin:0 0 10px;}
  .terms b{color:var(--ink);}
  .flagbox{background:#fff8e6;border:1px solid #e8d5a3;border-radius:10px;padding:14px 16px;font-size:14px;color:var(--ink);
    print-color-adjust:exact;-webkit-print-color-adjust:exact;}
  .flagbox p{margin:0 0 10px;} .flagbox p:last-child{margin-bottom:0;}
  /* signature */
  .sign-card{border:2px solid var(--blue);}
  .field{margin:14px 0;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;}
  .field input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:15px;}
  .sigpad-wrap{position:relative;}
  #sigpad{width:100%;height:170px;border:1px dashed #b9c2da;border-radius:10px;background:#fbfcfe;touch-action:none;display:block;}
  .sig-hint{position:absolute;left:14px;top:12px;color:#aab3c9;font-size:13px;pointer-events:none;}
  .sig-clear{margin-top:6px;font-size:12px;color:var(--blue);background:none;border:none;cursor:pointer;padding:2px;}
  .agree{display:flex;gap:9px;align-items:flex-start;font-size:14px;margin:16px 0;}
  .agree input{margin-top:3px;width:17px;height:17px;accent-color:var(--blue);flex:0 0 auto;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:700;
    border:none;border-radius:10px;padding:14px 22px;cursor:pointer;background:var(--blue);color:#fff;width:100%;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn.lime{background:var(--lime);color:var(--navy);}
  .note{font-size:13px;color:var(--faint);margin-top:12px;text-align:center;}
  .center{text-align:center;}
  .big-check{width:64px;height:64px;border-radius:50%;background:#e6f4ea;color:var(--green);
    display:grid;place-items:center;font-size:32px;margin:0 auto 14px;}
  .state-msg{padding:50px 20px;text-align:center;color:var(--soft);}
  .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;
    display:inline-block;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  footer{max-width:760px;margin:0 auto;padding:20px 18px;color:var(--faint);font-size:12px;text-align:center;}
  @media(max-width:560px){.parties{grid-template-columns:1fr;}}
  /* print / download for signature (non-techy: sign on paper) */
  .print-btn{position:fixed;top:14px;right:14px;z-index:50;display:none;background:var(--blue);color:#fff;
    border:none;border-radius:9px;padding:10px 15px;font-size:13px;font-weight:700;cursor:pointer;
    box-shadow:0 3px 12px rgba(20,37,67,.2);font-family:inherit;}
  .print-btn:hover{background:#2b4590;}
  .print-sign{display:none;}
  .print-sign .row{display:grid;grid-template-columns:1fr 1fr;gap:40px;}
  .print-sign .ln{border-bottom:1px solid #333;height:46px;margin-bottom:6px;}
  .print-sign .cap{font-size:12px;color:#333;}
  @media print{
    header{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .print-btn,.sign-card,#loading{display:none!important;}
    body:not([data-status="signed"]) .print-sign{display:block;}
    .card{box-shadow:none;border-color:#dfe4ec;break-inside:avoid;}
    h2.sec{break-after:avoid;}
    @page{margin:14mm 12mm;}
  }
</style>
</head>
<body>
<button class="print-btn" id="printBtn" onclick="window.print()" title="Descargar o imprimir para firma">⬇ Imprimir / PDF</button>
<header>
  <div class="head-inner">
    <img class="logo-img" src="https://dp3d2hb4975es.cloudfront.net/uploads/domo/2026/6/1/1780335566logosmall1.png" alt="Domo" onerror="this.style.display='none';document.getElementById('logo-fallback').style.display='block';" />
    <div class="logo" id="logo-fallback" style="display:none;">domo<span class="dot">.</span></div>
    <div class="doc-kicker">Construction Services Agreement</div>
    <div class="doc-title" id="doc-title">Home Project Agreement</div>
  </div>
</header>

<div class="wrap">
  <div id="loading" class="state-msg">Loading your agreement…</div>
  <div id="content" style="display:none;"></div>
</div>

<footer id="foot"></footer>

<script>
const SUPABASE_URL = 'https://mpgljurndbfusxtcrogr.supabase.co';
const SUPABASE_ANON = 'sb_publishable_eSqiIIUFZck9XFdpgE3Ctg_u3-lBI88';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// Warranty text (overridable per contract via c.guarantee_terms).
const DEFAULT_TERMS = {
  guarantee: "Domo stands behind its work. For one (1) year from substantial completion, Domo will correct at no charge any part of the completed work that fails because of defective workmanship — electrical connections, plumbing connections, block and structural-adjacent work, and anything that stops functioning as intended. Cosmetic and finish items are covered for ninety (90) days: plaster and joint cracking, nail pops, minor settlement movement, and surface finish; cracking, nail pops and movement that appear after the ninety-day cosmetic period are treated as normal settlement and are not covered. Materials, appliances and fixtures carry the manufacturer's warranty, which Domo passes through to the Client. Neither warranty covers damage from misuse, neglect, normal wear, moisture or weather, alterations or repairs by others, Client-supplied materials, or work Domo was directed to perform over its own written recommendation. Notify Domo in writing within the applicable period and allow reasonable access to inspect and correct. This warranty is in addition to, and does not replace or limit, any right the Client has under Puerto Rico law, including the warranty against hidden defects and the builder's liability for a structure under the Civil Code."
};

// Static legal clauses (plain text; \n\n = paragraph break). Dynamic clauses
// (payment, schedule, changes, permits) are assembled in render() so they use
// the contract's own numbers.
const CLAUSES = {
  finish_note: "Finish standard: surfaces are delivered patched, plastered and ready for paint. Painting, priming and final finishes are included only where listed in the scope above or in the quote.",
  not_included: "Unless expressly listed in the scope of work above or in the quote, this agreement excludes: permits and government fees; architectural, engineering or design services; hazardous-material testing or abatement (asbestos, mold, lead); structural repair or reinforcement; moving, storing or protecting the Client's furnishings and belongings; appliances, fixtures and finishes supplied by the Client; painting and final finishes; work on concealed conditions not visible to a contractor on reasonable inspection at the time of quoting; and any work not described in the scope.",
  completion: "The work is substantially complete when the scope has been performed and the affected areas can be used for their intended purpose; minor items that do not prevent that use and can be corrected without significant disruption may remain.\n\nDomo notifies the Client and the parties walk the work together within five (5) working days, recording one written punch list of anything that does not meet the scope. The final payment is due at the walkthrough, except that the Client may hold back the reasonable cost of the punch items — priced by agreement, or by a third-party estimate if the parties cannot agree — and releases that holdback within three (3) working days of those items being corrected. Domo corrects punch items within ten (10) working days unless a part or trade requires longer.\n\nAs a backstop only: if fifteen (15) working days pass from Domo's notice without a walkthrough for reasons within the Client's control, and the Client has not given a written list of objections, the work is treated as substantially complete and the final payment becomes due — but the Client's punch-list holdback right and the warranty both survive. Using the finished rooms is not, by itself, acceptance of the work.",
  concealed: "The scope and price are based on what was visible at the time of quoting. Except where the scope or quote says otherwise, all walls, ceilings and openings in the scope are assumed to be non-structural and non-load-bearing, based on visual inspection only.\n\nIf Domo encounters a concealed condition — hidden piping or wiring, water damage, termite or structural damage, unpermitted prior work, or suspected hazardous material — or if any element proves to be load-bearing, Domo stops work in that area, notifies the Client within twenty-four (24) hours with photographs, and prices the additional work as a change order. Structural repair, engineering and hazardous-material abatement are outside this agreement unless the scope or quote includes them, and are the Client's to authorize and pay for. If the Client does not decide within five (5) working days of the notice, the schedule extends by the delay and the remobilization fee described above may apply.",
  materials: "Principal materials — with brand, model, color and specification where applicable — are listed in the quote delivered with this agreement. Domo furnishes materials of good quality suitable for the work unless the Client specifies otherwise in writing. Where a specified item is unavailable or discontinued, Domo notifies the Client and may substitute an item of equal or better quality and specification.\n\nTitle and risk of loss for materials pass to the Client on delivery to the site or on payment, whichever is earlier — except that Domo remains responsible for loss or damage caused by Domo, its employees or its subcontractors. A material price increase adjusts the price only where it exceeds 10% of that item's quoted cost, arises after a Client-caused delay of more than ten (10) working days, and is shown to the Client with supplier documentation before the material is ordered.",
  site: "Domo works from 7:00 a.m. to 3:00 p.m., Monday through Friday, and may stay until 5:00 p.m. at no extra charge where finishing a task in progress avoids leaving the area unsafe or unusable overnight. The Client provides safe, unobstructed access from 7:00 a.m. to 5:00 p.m. on working days, along with water and electricity at the site at no charge to Domo; Saturday and evening work is by agreement.\n\nBefore the start date the Client clears the work area of furniture, belongings and anything fragile or valuable, and discloses in writing any condition it knows of behind the walls or under the floors. Domo is not responsible for pre-existing conditions, for damage to items the Client failed to remove after being asked, or for ordinary dust and vibration inherent in demolition work; this does not excuse damage caused by Domo's own negligence. Where the Client supplies appliances, fixtures or finishes, they must be on site before the week they are needed, and selections are due at least five (5) working days before they are needed.",
  responsibility: "Each party is responsible for its own negligence and will indemnify the other against third-party claims arising from its own negligent acts or omissions in connection with the work. Domo may perform the work through its own personnel or qualified subcontractors and remains responsible to the Client for the work either way. The Client maintains its own property and homeowner's insurance in force throughout the work.",
  cleanup: "Domo removes its debris and leaves the work area in broom-clean condition — swept, with construction debris, packaging and offcuts removed from the property — at completion. Disposal of construction debris is included where listed in the scope; otherwise it is billed at cost. Final detailed cleaning and painting-grade dust removal are not included.",
  liability: "Please read this section — it limits what you can recover from Domo. Except for the items listed next, the most Domo can be required to pay under this agreement is the contract price. That limit does not apply to injury to a person, damage caused by Domo's gross negligence or willful misconduct, or Domo's indemnity obligations above. Neither party pays the other for knock-on losses — lost rental or business income, loss of use of the property, or a drop in property value. Nothing in this agreement limits a right or a liability that Puerto Rico law does not allow to be limited or waived.",
  cancel_3day: "Your right to cancel. If the Client signed this agreement somewhere other than Domo's place of business, the Client may cancel it without cost or penalty within three (3) business days of signing, by written notice to Domo at the mailing or email address in this agreement. On a timely cancellation Domo refunds the full deposit within ten (10) days and bears the cost of anything it chose to order during those three days.",
  cancel_after: "After the three-day period but before work begins, the Client may still cancel; Domo retains only its documented costs actually incurred — scheduling, evaluation, and non-returnable materials already ordered — and refunds the rest of the deposit within ten (10) days, with receipts. Once work has begun, the Client may end this agreement on written notice and pays for the work performed and materials supplied through that date, plus any non-cancellable commitments, plus Domo's documented direct costs of demobilizing. Domo may end this agreement on written notice if the property is unsafe or a condition makes the work impracticable, and refunds anything paid for work not performed.",
  termination: "Either party may terminate for material breach if the breach is not cured within ten (10) calendar days of written notice. Non-payment is a material breach. If Domo is in default, the Client may terminate, recover any amount paid for work not performed, and recover the reasonable additional cost of having another contractor complete the scope, up to the unpaid balance of the contract price.",
  liens: "Domo and its suppliers retain any lien rights provided by Puerto Rico law until paid in full. On final payment, Domo provides a written release of lien rights for the work covered by that payment.",
  notices: "Notices of breach, suspension or termination must be in writing and sent by email — to Domo at info@domoyourhome.com and to the Client at the email address in this agreement — and are effective when sent. Each party keeps its email current. A notice to cancel under the three-day right may also be sent by mail to Domo's address. Day-to-day communication and change-order approvals may be by email or WhatsApp.",
  general: "Domo performs as an independent contractor, not an employee or partner of the Client. This agreement, together with the quote delivered with it and any approved change orders, is the entire agreement and supersedes prior discussions, proposals and estimates. Neither party may assign it without the other's written consent, not to be unreasonably withheld. If any provision is unenforceable, the remainder stays in effect. This agreement may be signed electronically, with the same effect as a handwritten signature.\n\nThis agreement is governed by the laws of the Commonwealth of Puerto Rico. The parties will first try to resolve any dispute in good faith directly, within fifteen (15) days of written notice. Unresolved disputes go to the Court of First Instance, San Juan Judicial Region. The prevailing party in an action to enforce this agreement is entitled to its reasonable attorney's fees and costs. Nothing here prevents either party from bringing a claim before the Puerto Rico Department of Consumer Affairs (DACo)."
};

const params = new URLSearchParams(location.search);
const token = params.get('t') || params.get('token');
let contract = null, company = {};

function money(n){ return '$' + (Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){ if(!iso) return ''; const d=new Date(iso); return isNaN(d)?'':d.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}); }

async function boot(){
  if(!token){ showState('This link is missing its agreement code. Please use the link Domo sent you.'); return; }
  // company details (best-effort)
  try{
    const { data } = await sb.from('settings').select('key,value');
    (data||[]).forEach(r=> company[r.key]=r.value);
  }catch(e){}
  const { data, error } = await sb.from('contracts').select('*').eq('public_token', token).maybeSingle();
  if(error || !data){ showState('We couldn’t find this agreement. The link may be invalid or expired — please contact Domo.'); return; }
  contract = data;
  render();
}

function showState(msg){
  document.getElementById('loading').style.display='none';
  const c=document.getElementById('content'); c.style.display='block';
  c.innerHTML = `<div class="card"><div class="state-msg">${esc(msg)}</div></div>`;
  setFooter();
}

function setFooter(){
  const name = company.company_name || 'Domo';
  const bits = [name, company.company_phone, company.company_email, company.company_website].filter(Boolean).map(esc);
  document.getElementById('foot').innerHTML = bits.join(' · ')
    + '<div style="margin-top:8px;font-size:11px;color:var(--faint);max-width:600px;margin-left:auto;margin-right:auto;">This is a general construction services contract and not legal advice. Terms should be reviewed by qualified counsel before use.</div>';
}

function render(){
  document.getElementById('loading').style.display='none';
  const el = document.getElementById('content'); el.style.display='block';
  const c = contract;
  const companyName = company.company_name || 'Domo';
  const terms = { guarantee: c.guarantee_terms || DEFAULT_TERMS.guarantee };
  const total = Number(c.contract_total)||0;
  const deposit = Number(c.deposit_amount)||0;
  const balance = Math.max(0, total - deposit);
  const statusLabel = {draft:'Draft',sent:'Awaiting signature',signed:'Signed',void:'Voided'}[c.status]||c.status;

  const signedBlock = c.status==='signed' ? `
    <div class="card center">
      <div class="big-check">✓</div>
      <h2 style="margin:0 0 4px;">Agreement signed</h2>
      <p style="color:var(--soft);margin:0;">Signed by <b>${esc(c.signer_name||'')}</b> on ${esc(fmtDate(c.signed_at))}.</p>
      ${deposit>0 ? `<p class="note">Your deposit of <b>${money(deposit)}</b> reserves your spot. Domo will send the deposit invoice to ${esc(c.client_email||'you')}.</p>`:''}
    </div>` : '';

  const signForm = (c.status==='draft'||c.status==='sent') ? `
    <div class="card sign-card">
      <h2 class="sec">Sign to accept</h2>
      <p style="font-size:14px;color:var(--soft);margin-top:0;">By signing, you agree to the scope, price, and terms above.</p>
      <div class="field">
        <label for="signer">Your full name</label>
        <input type="text" id="signer" placeholder="Type your full legal name" value="${esc(c.client_name||'')}" />
      </div>
      <div class="field">
        <label>Signature</label>
        <div class="sigpad-wrap">
          <canvas id="sigpad"></canvas>
          <span class="sig-hint" id="sig-hint">Draw your signature here</span>
        </div>
        <button type="button" class="sig-clear" onclick="clearSig()">Clear signature</button>
      </div>
      <label class="agree"><input type="checkbox" id="agree" />
        <span>I have read and agree to this Service Agreement${deposit>0?` and understand a deposit of <b>${money(deposit)}</b> is due to schedule the work`:''}.</span></label>
      <button class="btn" id="sign-btn" onclick="submitSign()">Sign agreement</button>
      <div class="note">${esc(companyName)} · secure electronic signature</div>
    </div>` : '';

  const voidBlock = c.status==='void' ? `<div class="card"><div class="state-msg">This agreement has been voided by Domo. Please contact us for an updated version.</div></div>` : '';

  const paras = body => body.split('\n\n').map(p=>`<p>${esc(p)}</p>`).join('');
  const clause = (title, body) => `<h2 class="sec">${title}</h2><div class="terms">${paras(body)}</div>`;
  const flagClause = (title, body) => `<h2 class="sec">${title}</h2><div class="flagbox">${paras(body)}</div>`;

  // Payment schedule (revised weekly mechanics; adapts to the contract's deposit).
  const payment = c.payment_terms || [
    'Domo bills weekly for the work actually completed. Apart from the deposit, nothing is billed before the work it pays for is done.',
    (deposit>0
      ? `A deposit of ${money(deposit)}${c.deposit_percent?` (~${c.deposit_percent}%)`:''} is due on signing to reserve the crew and start date; it is credited back to the Client against the earliest weekly invoices. Domo then bills every week for the work completed that week, valued at the line-item prices in the quote.`
      : 'Domo bills every week for the work completed that week, valued at the line-item prices in the quote.')
      + ' Total billing before substantial completion — deposit and weekly invoices combined — will not exceed 90% of the contract price; the remaining 10% is billed only at the walkthrough.',
    'Weekly invoices are due within five (5) calendar days. Amounts unpaid more than ten (10) calendar days after their due date carry a late charge of 1.5% per month on the overdue amount; Domo owes the Client the same 1.5% per month on any amount it must refund and does not refund on time. If an invoice is more than ten (10) calendar days overdue, Domo may suspend work on written notice until it is paid, and the schedule extends by the suspension plus two (2) working days to remobilize. Paying an invoice is not acceptance of the work and does not waive the warranty. If the Client disputes an item, the Client pays the undisputed part on time and raises the disputed item in writing within those five (5) days.'
  ].join('\n\n');

  // Schedule — good-faith estimates (no "time not of the essence"); firm when marked.
  const dateLine = [
    c.start_date ? `Start date: ${fmtDate(c.start_date)}.` : '',
    c.completion_date ? `Substantial completion by: ${fmtDate(c.completion_date)}.` : ''
  ].filter(Boolean).join(' ');
  const firmLine = (c.hard_deadline && c.completion_date)
    ? ` The parties agree the substantial-completion date above is a firm deadline; Domo will meet it except for the extension events listed below.`
    : ` Where the parties expressly agree in writing that the completion date is a firm deadline, Domo will meet that date except for the extension events listed below.`;
  const schedule = (dateLine ? dateLine + ' ' : '')
    + 'The start and substantial-completion dates above are good-faith estimates.' + firmLine
    + ' They extend, without penalty to either party, by the time actually lost to approved change orders, concealed conditions, permit delays, material shortages, Client-caused delays, and events beyond Domo’s reasonable control, including severe weather, hurricane warnings, utility interruptions, strikes and government action. Domo will notify the Client in writing when any of these arises and state the expected extension.'
    + `\n\nIf the Client suspends the work, or delays access, a decision or a selection, by more than five (5) working days, Domo may charge a reasonable remobilization fee, quoted to the Client in writing before the charge is incurred.`;

  const changes = c.change_order_terms ||
    `Any change to the scope, materials, price or schedule must be approved in writing before the additional work begins. Email or WhatsApp is fine — a written approval sent from the Client’s email address or phone number in this agreement counts as a signature. Domo quotes the additional work — a fixed price or an agreed rate, plus materials at cost with receipts — and begins only once the Client approves it in writing. Approved changes adjust the total price and the dates above. Domo is not obligated to perform work that has not been approved in writing.`;

  const permits = `Permits and government fees are the Client’s responsibility and are not included in the price. At the Client’s written request, Domo will obtain permits as the Client’s agent, and the Client reimburses the actual fees plus a reasonable handling charge agreed in advance. The Client confirms it owns the property or has authority to permit the work, and will obtain any homeowner-association, condominium or landlord approvals required. Neither party is responsible for delays caused by permitting authorities or associations.`;

  const cancellation = c.cancellation_terms || null; // if set, render as one clause; else use 3-day + after

  el.innerHTML = `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">
        <div style="color:var(--soft);font-size:14px;">Prepared ${esc(fmtDate(c.created_at))}</div>
        <span class="status-pill ${esc(c.status)}">${esc(statusLabel)}</span>
      </div>

      <h2 class="sec">Parties</h2>
      <div class="parties">
        <div class="party">
          <div class="role">Contractor</div>
          <div class="name">${esc(companyName)}</div>
          <div class="meta">${[company.company_address,company.company_phone,company.company_email].filter(Boolean).map(esc).join('<br>')||'Puerto Rico'}${(company.company_daco_reg||company.company_license)?`<br>${[company.company_daco_reg?('DACO Reg. '+esc(company.company_daco_reg)):'',company.company_license?('Lic. '+esc(company.company_license)):''].filter(Boolean).join(' · ')}`:''}</div>
        </div>
        <div class="party">
          <div class="role">Client</div>
          <div class="name">${esc(c.client_name||'—')}</div>
          <div class="meta">${[c.client_property,c.client_email].filter(Boolean).map(esc).join('<br>')}</div>
        </div>
      </div>

      <h2 class="sec">Scope of work</h2>
      <div class="scope-box">${esc(c.scope||'See attached quote.')}</div>
      <p style="font-size:12.5px;color:var(--faint);margin-top:8px;">${esc(CLAUSES.finish_note)}</p>
      ${clause('What is not included', CLAUSES.not_included)}

      <h2 class="sec">Contract price</h2>
      <div class="price-grid">
        <div class="lbl">Total, including IVU</div><div class="val total">${money(total)}</div>
        ${deposit>0?`<div class="lbl deposit">Deposit due on signing</div><div class="val deposit">${money(deposit)}${c.deposit_percent?` (~${esc(c.deposit_percent)}%)`:''}</div>`:''}
        ${deposit>0?`<div class="lbl">Balance (billed in progress + final)</div><div class="val">${money(balance)}</div>`:''}
      </div>
      <p style="font-size:12.5px;color:var(--faint);margin-top:8px;">Prices are in USD and fixed for the scope described. IVU is included in the total above and in every rate stated in this agreement. This price is open for acceptance for thirty (30) days from the quote date. Materials outside the described scope are quoted and billed separately at cost, with receipts.</p>

      <h2 class="sec">Payment schedule</h2>
      <div class="terms">${paras(payment)}</div>

      ${clause('Schedule', schedule)}
      ${clause('Completion &amp; walkthrough', CLAUSES.completion)}
      ${clause('Changes to the work', changes)}
      ${clause('Concealed &amp; structural conditions', CLAUSES.concealed)}
      ${clause('Permits &amp; licenses', permits)}
      ${clause('Materials, title &amp; risk of loss', CLAUSES.materials)}
      ${clause('Site access &amp; client responsibilities', CLAUSES.site)}
      ${clause('Responsibility', CLAUSES.responsibility)}
      ${clause('Cleanup', CLAUSES.cleanup)}
      ${clause('Workmanship warranty', terms.guarantee)}
      ${flagClause('Limitation of liability', CLAUSES.liability)}
      ${cancellation ? clause('Cancellation &amp; termination', cancellation) : flagClause('Cancellation — your right to cancel', CLAUSES.cancel_3day) + clause('Cancellation &amp; termination', CLAUSES.cancel_after)}
      ${clause('Default', CLAUSES.termination)}
      ${clause('Liens', CLAUSES.liens)}
      ${clause('Notices', CLAUSES.notices)}
      ${clause('Dispute resolution &amp; general', CLAUSES.general)}
    </div>
    <div class="card print-sign">
      <h2 class="sec" style="margin-top:0;border-top:none;padding-top:0;">Signatures</h2>
      <div class="row">
        <div><div class="ln"></div><div class="cap">Client — ${esc(c.client_name||'')} &middot; Date</div></div>
        <div><div class="ln"></div><div class="cap">For ${esc(companyName)} &middot; Date</div></div>
      </div>
      <p class="cap" style="margin-top:16px;">By signing above, the Client agrees to the scope, price, payment schedule and terms in this agreement. A copy is provided to the Client.</p>
    </div>
    ${signedBlock}${signForm}${voidBlock}`;

  document.body.setAttribute('data-status', c.status);
  document.getElementById('printBtn').style.display = 'block';
  setFooter();
  if(c.status==='draft'||c.status==='sent') initSigPad();
}

// ---- signature pad ----
let sigCtx=null, drawing=false, hasInk=false;
function initSigPad(){
  const cv=document.getElementById('sigpad'); if(!cv) return;
  const ratio=window.devicePixelRatio||1;
  const rect=cv.getBoundingClientRect();
  cv.width=rect.width*ratio; cv.height=rect.height*ratio;
  sigCtx=cv.getContext('2d'); sigCtx.scale(ratio,ratio);
  sigCtx.lineWidth=2.2; sigCtx.lineCap='round'; sigCtx.lineJoin='round'; sigCtx.strokeStyle='#142543';
  const pos=e=>{const r=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};};
  const start=e=>{drawing=true;const p=pos(e);sigCtx.beginPath();sigCtx.moveTo(p.x,p.y);e.preventDefault();};
  const move=e=>{if(!drawing)return;const p=pos(e);sigCtx.lineTo(p.x,p.y);sigCtx.stroke();hasInk=true;document.getElementById('sig-hint').style.display='none';e.preventDefault();};
  const end=()=>{drawing=false;};
  cv.addEventListener('mousedown',start); cv.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
  cv.addEventListener('touchstart',start,{passive:false}); cv.addEventListener('touchmove',move,{passive:false}); cv.addEventListener('touchend',end);
}
function clearSig(){ const cv=document.getElementById('sigpad'); if(cv&&sigCtx){sigCtx.clearRect(0,0,cv.width,cv.height);hasInk=false;document.getElementById('sig-hint').style.display='block';} }

async function submitSign(){
  const name=(document.getElementById('signer').value||'').trim();
  const agreed=document.getElementById('agree').checked;
  if(!name){ alert('Please type your full name.'); return; }
  if(!hasInk){ alert('Please draw your signature.'); return; }
  if(!agreed){ alert('Please check the box to agree to the terms.'); return; }
  const btn=document.getElementById('sign-btn'); btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Signing…';
  let sigData=''; try{ sigData=document.getElementById('sigpad').toDataURL('image/png'); }catch(e){}
  try{
    const { error } = await sb.from('contracts').update({
      status:'signed', signed_at:new Date().toISOString(), signer_name:name, signature_data:sigData
    }).eq('public_token', token).neq('status','signed'); // don't overwrite an existing signature
    if(error) throw error;
    contract.status='signed'; contract.signed_at=new Date().toISOString(); contract.signer_name=name;
    window.scrollTo({top:0,behavior:'smooth'});
    render();
  }catch(e){
    btn.disabled=false; btn.innerHTML='Sign agreement';
    alert('We couldn’t record your signature: '+e.message);
  }
}

boot();
